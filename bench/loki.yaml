# Single-binary Loki with local filesystem storage (the documented "monolithic" mode).
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_server_max_recv_msg_size: 33554432
common:
  path_prefix: /loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage:
    filesystem: { chunks_directory: /loki/chunks, rules_directory: /loki/rules }
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }
limits_config:
  allow_structured_metadata: true
  # Raised so the test measures throughput, not the default per-tenant rate limit.
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  per_stream_rate_limit: 256MB
  per_stream_rate_limit_burst: 512MB
  max_entries_limit_per_query: 5000
  max_query_series: 10000
query_range:
  cache_results: false     # no result cache, so repeated queries do real work
analytics:
  reporting_enabled: false
