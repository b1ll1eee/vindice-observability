# Benchmark copy of deploy/docker-compose.yml (run from bench/): same images, limits and ClickHouse config,
# released image instead of a local build, separate project name and ports.
name: vbench
services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 20971520
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes: [kafka-data:/var/lib/kafka/data]
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: vindice
      CLICKHOUSE_PASSWORD: vindice
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../deploy/clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ../deploy/clickhouse/users.d/low-memory.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "vindice", "--password", "vindice", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 24
  vindice:
    image: ghcr.io/b1ll1eee/vindice-observability:0.1.0
    command: ["-mode=all"]
    env_file: [bench.env]
    environment:
      VINDICE_KAFKA_BROKERS: kafka:9092
      VINDICE_CH_ADDR: clickhouse:9000
      VINDICE_CH_USER: vindice
      VINDICE_CH_PASSWORD: vindice
      VINDICE_ADMIN_USERNAME: admin
    ports: ["14318:4318", "18080:8080"]
    mem_limit: 1536m   # raised from 512m: the default was OOM-killed under this load
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
volumes:
  kafka-data:
  clickhouse-data:
