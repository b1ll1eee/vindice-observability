name: vindice

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MESSAGE_MAX_BYTES: 20971520
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "19092:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_USER: vindice
      CLICKHOUSE_PASSWORD: vindice
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/low-memory.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "vindice", "--password", "vindice", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  vindice:
    build: ..
    command: ["-mode=all"]
    environment:
      VINDICE_KAFKA_BROKERS: kafka:9092
      VINDICE_CH_ADDR: clickhouse:9000
      VINDICE_CH_USER: vindice
      VINDICE_CH_PASSWORD: vindice
      VINDICE_RULES_FILE: /etc/vindice/rules.json
      # Alerts: set these in deploy/.env (never commit the token).
      VINDICE_TELEGRAM_BOT_TOKEN: ${VINDICE_TELEGRAM_BOT_TOKEN:-}
      VINDICE_TELEGRAM_CHAT_ID: ${VINDICE_TELEGRAM_CHAT_ID:-}
      VINDICE_TELEGRAM_API: ${VINDICE_TELEGRAM_API:-https://api.telegram.org}
      VINDICE_PUBLIC_URL: ${VINDICE_PUBLIC_URL:-http://localhost:8080}
      # First admin (only used while there are no users) and session key.
      VINDICE_ADMIN_USERNAME: ${VINDICE_ADMIN_USERNAME:-admin}
      VINDICE_ADMIN_PASSWORD: ${VINDICE_ADMIN_PASSWORD:-}
      VINDICE_SESSION_SECRET: ${VINDICE_SESSION_SECRET:-}
      # Keep the Go heap under the container limit (mem_limit below), with headroom.
      GOMEMLIMIT: 400MiB
    volumes:
      - ../examples/rules.json:/etc/vindice/rules.json:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped

volumes:
  kafka-data:
  clickhouse-data:
