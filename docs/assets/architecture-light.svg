<text x="502" y="128" font-size="12.5" fill="#5f6673">ack only after write</text>
<text x="502" y="148" font-size="12.5" fill="#5f6673">replay after outages</text>
<text x="502" y="168" font-size="12.5" fill="#5f6673">zstd compressed</text>
