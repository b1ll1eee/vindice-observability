<text x="734" y="128" font-size="12.5" fill="#1b1e24">tail sampling</text>
<text x="734" y="148" font-size="12.5" fill="#1b1e24">RED before sampling</text>
<text x="734" y="168" font-size="12.5" fill="#1b1e24">dedupe, large batches</text>
