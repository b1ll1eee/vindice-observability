<text x="966" y="128" font-size="12.5" fill="#5f6673">1m / 1h rollups</text>
<text x="966" y="148" font-size="12.5" fill="#5f6673">per-severity retention</text>
<text x="966" y="168" font-size="12.5" fill="#5f6673">token + bloom indexes</text>
